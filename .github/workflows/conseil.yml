name: Conseil quotidien

# Tous les jours à 18h45 (heure de Paris), après la clôture de Xetra.
on:
  schedule:
    - cron: "45 16 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-etat
  cancel-in-progress: false

jobs:
  conseil:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Analyser le marché
        run: python -m invest_bot conseil

      - name: Enregistrer l'analyse
        run: |
          git config user.name "bot-investissement"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat rapports
          git diff --cached --quiet || git commit -m "Analyse du $(date +%F)"
          git pull --rebase && git push

      - name: Publier la proposition
        run: python -m invest_bot publier

      - name: Enregistrer le numéro du ticket
        run: |
          git add etat
          git diff --cached --quiet || (git commit -m "Proposition publiée" && git pull --rebase && git push)
