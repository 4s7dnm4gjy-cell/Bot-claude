name: Backtest sur données réelles

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 1 * *"   # le 1er de chaque mois

permissions:
  contents: write

concurrency:
  group: bot-etat
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Tests
        run: python -m pytest -q
      - name: Backtest
        run: python -m invest_bot backtest --rapport rapports/backtest.md --stats-ticker
      - name: Enregistrer le rapport
        run: |
          git config user.name "bot-investissement"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rapports
          git diff --cached --quiet || (git commit -m "Backtest du $(date +%F)" && git pull --rebase && git push)
