name: Opportunité du jour

# Propose une opportunité du radar une fois par jour, juste après le conseil
# quotidien. Sans réponse le lendemain, le ticket est fermé et le titre suivant
# est proposé (config.yaml : radar.express_minutes).
# Un titre n'est jamais proposé deux fois. Léger : aucun cours n'est téléchargé,
# la liste des candidats est préparée chaque soir par le conseil quotidien.
on:
  schedule:
    - cron: "15 17 * * *"   # UTC : 19h15 à Paris l'été, 18h15 l'hiver (après le conseil de 16h45 UTC)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: bot-etat
  cancel-in-progress: false

jobs:
  express:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Proposer l'opportunité suivante
        run: python -m invest_bot express
      - name: Enregistrer
        run: |
          git config user.name "bot-investissement"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add etat
          git diff --cached --quiet || (git commit -m "Radar express $(date +%H:%M)" && git pull --rebase && git push)
