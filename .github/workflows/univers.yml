name: Mise à jour de l'univers du radar

# Le 1er de chaque mois : relit la composition des grands indices mondiaux
# et met à jour radar_univers.yaml (entrées et sorties d'indice).
on:
  schedule:
    - cron: "7 5 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-etat
  cancel-in-progress: false

jobs:
  univers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Construire l'univers
        run: python -m invest_bot univers
      - name: Enregistrer
        run: |
          git config user.name "bot-investissement"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add radar_univers.yaml
          git diff --cached --quiet || (git commit -m "Univers du radar mis à jour ($(date +%F))" && git pull --rebase && git push)
